name: Website

permissions:
  contents: read

# Pull request runs cancel stale ones. On main a running deploy always
# finishes: a newer push waits behind it (GitHub keeps only the newest
# pending run), so frequent pushes cannot cancel every deploy in turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/site.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/site.yaml"

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # check-site and check-budget read all ~15,700 built pages; the default
      # Node heap runs out (seen locally on 2026-11-15).
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      # Node is pinned by `devEngines.runtime` in site/package.json; pnpm
      # downloads it into node_modules, so no setup-node step is needed.
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm exec vitest run
      - name: Type check
        run: pnpm exec astro sync && pnpm exec tsc --noEmit
      - name: Build
        run: pnpm exec astro build
      - name: Check pages, links, metadata and claims wording
        run: pnpm exec node scripts/check-site.mjs
      - name: No two pages share a title, H1 or description (SEO-006, SEO-015)
        run: pnpm exec node --max-old-space-size=6144 scripts/check-duplicates.mjs --exact
      - name: No two pages of one type read the same in search (SEO-006 title and H1 patterns)
        run: pnpm exec node --max-old-space-size=6144 scripts/check-duplicates.mjs --patterns
      - name: Every indexable page has two or more pages linking to it (SEO-014)
        run: pnpm exec node --max-old-space-size=6144 scripts/check-orphans.mjs --strict
      - name: Structured data matches the visible page (SEO-013, SEO-042, SEO-043, SEO-047)
        run: pnpm exec node scripts/check-structured-data.mjs
      - name: Page weight budget (WEB-074)
        run: pnpm exec node scripts/check-budget.mjs
      - name: Images (alt text, size in the page, no picture sent at over twice its width)
        run: pnpm exec node scripts/check-images.mjs
      - name: Hosting capacity, files against the host's limit (PLAT-015)
        run: pnpm exec node scripts/check-capacity.mjs
      - name: Install Playwright Chromium for accessibility checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Accessibility checks (axe, reflow, zoom, motion, Rest on every game)
        run: pnpm check:a11y
      - name: Long text and right-to-left fit (WEB-043, 320 to 1440 px, 200% text; about 11 seconds)
        run: pnpm check:text-fit
      - name: Print check (every activity card is one two-sided sheet on A4 and US Letter)
        run: pnpm check:print
      - name: Group view (opens on every card, walks every step, fits eight screen sizes)
        run: pnpm check:group
      - name: Install Playwright Firefox and WebKit for the cross-browser check
        run: pnpm exec playwright install --with-deps firefox webkit
      - name: Cross-browser flows in Chromium, Firefox and WebKit (WebKit is Safari's engine, not Safari)
        run: pnpm check:browsers
      - name: Keep the checked build for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: site/dist
          retention-days: 1

  # Pushes to main publish the build that the job above just checked, so the
  # live site is always a tested commit. Pull requests never deploy. Needs two
  # repository secrets: CLOUDFLARE_API_TOKEN (a token scoped to Workers
  # Scripts: Edit on this account) and CLOUDFLARE_ACCOUNT_ID. The www redirect
  # Worker (redirect-www/) rarely changes and stays a manual deploy.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://creativeactivities.org
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Fetch the checked build
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: site/dist
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          packageManager: pnpm
          command: deploy
      - name: Tell IndexNow about the live pages
        # Bing and partners only; Google ignores IndexNow. A failure here must
        # not mark a successful deploy red.
        continue-on-error: true
        run: pnpm exec node scripts/indexnow.mjs
